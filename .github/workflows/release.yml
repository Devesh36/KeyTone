name: Release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: "--config src-tauri/tauri.linux-ci.conf.json"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxtst-dev libxdo-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Configure Linux AppImage tray library
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          indicator_library="$(ldconfig -p | awk '/libayatana-appindicator3\.so\.1/{ print $NF; exit }')"
          test -n "$indicator_library"
          jq -n --arg indicator_library "$indicator_library" '{
            bundle: {
              linux: {
                appimage: {
                  files: {
                    "/usr/lib/libayatana-appindicator3.so.1": $indicator_library
                  }
                }
              }
            }
          }' > apps/desktop/src-tauri/tauri.linux-ci.conf.json
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-14' && '-' || '' }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: Keytone v__VERSION__
          releaseBody: Download Keytone for macOS, Windows, or Linux below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      - name: Verify Linux AppImage runtime dependencies
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          appimage="$(find apps/desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          (
            cd "$extract_dir"
            "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          )
          for library in \
            libayatana-appindicator3.so.1 \
            libayatana-ido3-0.4.so.0 \
            libdbusmenu-glib.so.4 \
            libdbusmenu-gtk3.so.4
          do
            test -e "$extract_dir/squashfs-root/usr/lib/$library"
          done

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Publish completed release
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
