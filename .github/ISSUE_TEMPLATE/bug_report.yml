name: Bug report
description: Report a reproducible Keytone problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Do not include typed text, key histories, or sensitive keyboard data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Keytone version
    validations:
      required: true
  - type: textarea
    id: audio
    attributes:
      label: Audio device and relevant logs
